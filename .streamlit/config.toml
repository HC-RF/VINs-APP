# Streamlit configuration. Applies both locally and on Streamlit Community Cloud.

[theme]
base = "dark"
primaryColor = "#4c8dff"
backgroundColor = "#080b14"
secondaryBackgroundColor = "#101728"
textColor = "#e7ecf7"

[server]
# The "Extract from Excel" tab accepts spreadsheet uploads. Inventory workbooks
# with images or many sheets run well past a few megabytes, so this is sized for
# a realistic file while still bounding what a single request can push.
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Keep internals out of a publicly reachable browser; full tracebacks still go
# to the server log (Manage app -> Logs on Streamlit Cloud).
# Modern Streamlit expects a string here - "full" | "stacktrace" | "type" |
# "none" - not the legacy boolean.
# Set to "full" while debugging a deployment.
showErrorDetails = "none"
